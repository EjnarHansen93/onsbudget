<style>
  :root{
    --purple:#7B57FF; --purple-d:#6A45F5; --mint:#5FD9C0; --mint-d:#47C9AE;
    --bg:#F1F1F6; --card:#FFFFFF; --ink:#1B1B24; --muted:#8A8A98;
    --green:#12924E; --red:#E5484D; --line:#EDEDF2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#dcdce4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;padding-bottom:96px;}
  .safe-top{padding-top:env(safe-area-inset-top);}

  /* Header */
  .hdr{background:var(--purple);color:#fff;border-radius:0 0 30px 30px;padding:calc(env(safe-area-inset-top) + 14px) 20px 26px;position:relative;}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .hdr-title{font-size:23px;font-weight:800;text-align:center;line-height:1.15;}
  .hdr-sub{font-size:16px;font-weight:500;text-align:center;opacity:.95;text-transform:lowercase;}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}
  .icon-btn:active{background:rgba(255,255,255,.15);}

  /* Balance pill */
  .balance{background:#fff;margin:-22px auto 0;width:max-content;min-width:230px;text-align:center;padding:16px 34px;border-radius:40px;box-shadow:0 8px 24px rgba(60,50,120,.12);font-size:40px;font-weight:800;letter-spacing:-.5px;}
  .balance.pos{color:var(--green);} .balance.neg{color:var(--red);}

  .wrap{padding:18px 16px 0;}
  .cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .stat{background:#fff;border-radius:20px;padding:16px 12px 14px;text-align:center;position:relative;box-shadow:0 4px 14px rgba(60,50,120,.05);}
  .stat .lbl{font-size:13px;color:var(--muted);letter-spacing:.6px;margin-top:8px;font-weight:600;}
  .stat .val{font-size:18px;font-weight:800;margin-top:2px;}
  .stat .chev{position:absolute;top:12px;right:12px;color:#c9c9d4;}

  .panel{background:#fff;border-radius:20px;margin-top:16px;padding:6px 0 4px;box-shadow:0 4px 14px rgba(60,50,120,.05);overflow:hidden;}
  .panel-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px 8px;}
  .panel-h h3{margin:0;font-size:20px;font-weight:800;}
  .panel-h .count{color:var(--muted);font-weight:700;font-size:15px;}

  .tx{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);}
  .tx:first-child{border-top:none;}
  .tx:active{background:#f7f7fb;}
  .tx .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}
  .tx .mid{flex:1;min-width:0;}
  .tx .cat{font-weight:800;font-size:15.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx .desc{color:var(--muted);font-size:13.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx .right{text-align:right;flex:0 0 auto;}
  .tx .amt{font-weight:800;font-size:15.5px;}
  .tx .amt.in{color:var(--green);} .tx .amt.out{color:var(--red);}
  .tx .dt{color:var(--muted);font-size:12.5px;margin-top:2px;}

  .empty{padding:34px 20px;text-align:center;color:var(--muted);}

  .note{background:#fff;border-radius:16px;padding:16px 18px;margin-top:14px;box-shadow:0 4px 14px rgba(60,50,120,.05);}
  .note h4{margin:0 0 6px;font-size:17px;} .note p{margin:0;color:#5b5b68;font-size:14.5px;line-height:1.5;}

  /* Bottom nav + FAB */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;}
  .nav-inner{max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e9e9f0;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;color:#b6b6c2;font-size:11.5px;font-weight:700;flex:1;padding-top:4px;}
  .nav-btn.on{color:var(--ink);}
  .nav-spacer{flex:1;}
  .fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:62px;height:62px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(123,87,255,.45);}
  .fab:active{transform:translateX(-50%) scale(.94);}

  /* Sheet / modal */
  .overlay{position:fixed;inset:0;background:rgba(20,18,40,.35);z-index:60;display:flex;flex-direction:column;}
  .sheet{background:var(--bg);margin-top:auto;min-height:70vh;max-height:100vh;border-radius:0;display:flex;flex-direction:column;animation:up .22s ease;}
  .sheet.full{min-height:100vh;}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet-hdr{background:var(--purple);color:#fff;border-radius:0 0 30px 30px;padding:calc(env(safe-area-inset-top) + 14px) 18px 22px;}
  .sheet-hdr .top{display:flex;align-items:center;justify-content:space-between;}
  .sheet-hdr h2{margin:0;font-size:22px;font-weight:800;flex:1;text-align:center;}
  .seg{display:flex;gap:10px;margin-top:18px;}
  .seg button{flex:1;padding:12px 0;border-radius:30px;font-weight:800;font-size:16px;border:1.5px solid rgba(255,255,255,.6);color:#fff;}
  .seg button.on{background:#fff;color:var(--purple);border-color:#fff;}

  .sheet-body{padding:16px;overflow-y:auto;flex:1;}
  .amount-box{background:#fff;border-radius:22px;padding:20px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(60,50,120,.05);}
  .amount-box .eur{font-size:34px;font-weight:800;}
  .amount-inp{border:none;outline:none;font-size:40px;font-weight:800;width:100%;text-align:center;background:transparent;}
  .amount-box.err .eur{color:var(--red);} .amount-inp::placeholder{color:#cfcfd8;}
  .helper{color:var(--red);text-align:center;margin:8px 0 2px;font-weight:600;font-size:14px;}

  .row{background:#fff;border-radius:16px;margin-top:12px;display:flex;align-items:center;gap:14px;padding:14px 16px;box-shadow:0 4px 14px rgba(60,50,120,.04);}
  .row:active{background:#f7f7fb;}
  .row .ic{width:44px;height:44px;border-radius:50%;background:#f0f0f5;display:flex;align-items:center;justify-content:center;color:#3a3a46;flex:0 0 auto;}
  .row .ic.filled{color:#fff;}
  .row .txt{flex:1;font-size:17px;font-weight:600;}
  .row .txt.ph{color:#b3b3bf;}
  .row .chev{color:#c4c4d0;}
  .row input.desc{border:none;outline:none;font-size:17px;width:100%;background:transparent;}

  .save-bar{padding:16px;display:flex;gap:12px;align-items:center;}
  .save-x{width:56px;height:56px;border-radius:50%;background:#ececf2;display:flex;align-items:center;justify-content:center;color:#3a3a46;flex:0 0 auto;}
  .save-btn{flex:1;height:56px;border-radius:30px;background:var(--mint);color:#0d3b31;font-size:18px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;}
  .save-btn:active{background:var(--mint-d);}
  .del-btn{width:100%;text-align:center;color:var(--red);font-weight:700;padding:14px;font-size:15.5px;}

  /* Category grid */
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 4px;padding:6px 6px 20px;}
  .cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;}
  .cat:active{background:#f2f2f8;}
  .cat .circle{width:66px;height:66px;border-radius:50%;background:#f0f0f5;display:flex;align-items:center;justify-content:center;color:#333;}
  .cat .name{font-size:14px;text-align:center;line-height:1.15;color:#2b2b36;}

  /* Calendar */
  .cal{background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 4px 14px rgba(60,50,120,.05);}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-top .m{font-size:19px;font-weight:700;text-transform:lowercase;}
  .cal-top .navs{display:flex;gap:14px;color:var(--red);}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);color:var(--muted);font-size:12px;font-weight:700;text-align:center;margin-bottom:6px;}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:50%;}
  .day.sel{background:var(--red);color:#fff;font-weight:700;}
  .day:active{background:#f0f0f5;}
  .day.sel:active{background:var(--red);}

  /* Overzicht */
  .toggle2{display:flex;gap:0;background:#e9e9f1;border-radius:30px;padding:4px;margin:0 0 4px;}
  .toggle2 button{flex:1;padding:9px 0;border-radius:26px;font-weight:800;font-size:14.5px;color:#7a7a88;}
  .toggle2 button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .donut-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 6px;}
  .legend{margin-top:10px;width:100%;}
  .leg{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);}
  .leg:first-child{border-top:none;}
  .leg:active{background:#f7f7fb;}
  .leg .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}
  .leg .nm{flex:1;font-weight:700;font-size:15.5px;}
  .leg .pc{color:var(--muted);font-size:13px;font-weight:600;margin-right:8px;}
  .leg .vv{font-weight:800;font-size:15px;}

  /* Profielen */
  .pf{background:#fff;border-radius:16px;margin-top:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(60,50,120,.04);}
  .pf .av{width:46px;height:46px;border-radius:14px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto;}
  .pf input{border:none;outline:none;font-size:17px;font-weight:700;flex:1;background:transparent;}
  .pf .pick{color:var(--mint-d);font-weight:800;font-size:14px;}
  .pf.active{outline:2px solid var(--mint);}

  /* Gate */
  .gate{min-height:100vh;background:var(--purple);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;color:#fff;text-align:center;}
  .gate .logo{width:96px;height:96px;}
  .gate h1{margin:0;font-size:26px;font-weight:800;}
  .gate input{width:100%;max-width:280px;padding:15px 18px;border-radius:16px;border:none;font-size:18px;text-align:center;}
  .gate button{width:100%;max-width:280px;padding:15px;border-radius:16px;background:var(--mint);color:#0d3b31;font-weight:800;font-size:17px;}
  .gate .err{color:#ffd7d7;font-weight:600;min-height:20px;}

  .logo-hd{display:flex;align-items:center;gap:10px;}
  .toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#1b1b24;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.25);}
</style>
</head>

[...CATS.in, ...CATS.uit].forEach(c=>{ CAT_BY_KEY[c.key]=c; });
function catOf(key){ return CAT_BY_KEY[key] || {key, label:key, icon:'clip', color:'#868E96'}; }

/* ============ HELPERS ============ */
const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const DOW = ['MA','DI','WO','DO','VR','ZA','ZO'];
function fmtNum(n){ return Math.abs(n).toLocaleString('nl-BE',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtSigned(n){ const s = n>0?'+ ':(n<0?'- ':''); return '€ '+s+fmtNum(n); }
function pad(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fromDateStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function ddmmyy(s){ const [y,m,d]=s.split('-'); return `${d}/${m}/${y.slice(2)}`; }
function monthKey(y,m){ return `${y}-${pad(m+1)}`; }
function monthLabel(y,m){ return `${MONTHS[m]} ${y}`; }

/* ============ DONUTS ============ */
function MiniDonut({frac, color}){
  const r=27, c=2*Math.PI*r, f=Math.max(0,Math.min(1,frac||0));
  return <svg width="76" height="76" viewBox="0 0 76 76">
    <circle cx="38" cy="38" r={r} fill="none" stroke="#EDEDF2" strokeWidth="9"/>
    {f>0 && <circle cx="38" cy="38" r={r} fill="none" stroke={color} strokeWidth="9"
      strokeLinecap="round" strokeDasharray={`${c*f} ${c}`} strokeDashoffset="0"
      transform="rotate(-90 38 38)"/>}
  </svg>;
}
function BigDonut({items, total}){
  const r=52, c=2*Math.PI*r; let acc=0;
  return <svg width="168" height="168" viewBox="0 0 168 168">
    <circle cx="84" cy="84" r={r} fill="none" stroke="#EDEDF2" strokeWidth="26"/>
    {total>0 && items.map((it,i)=>{
      const len=c*(it.value/total);
      const el=<circle key={i} cx="84" cy="84" r={r} fill="none" stroke={it.color} strokeWidth="26"
        strokeDasharray={`${len} ${c-len}`} strokeDashoffset={-acc} transform="rotate(-90 84 84)"/>;
      acc+=len; return el;
    })}
  </svg>;
}

/* ============ GATE ============ */
function Gate({onOk}){
  const [v,setV]=useState(""); const [err,setErr]=useState("");
  function submit(){ if(v.trim().toLowerCase()===ACCESS_CODE.toLowerCase()){ localStorage.setItem('budget_ok','1'); onOk(); } else { setErr("Foute code"); } }
  return <div className="gate">
    <svg className="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#fff" opacity="0.14"/><path d="M13 31 L32 14 L51 31" fill="none" stroke="#fff" strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round"/><path d="M17 28 V50 H47 V28" fill="none" stroke="#fff" strokeWidth="3.4" strokeLinejoin="round"/><text x="32" y="47" textAnchor="middle" fontSize="20" fontWeight="800" fill="#fff">€</text></svg>
    <h1>OnsBudget</h1>
    <input type="password" inputMode="text" placeholder="Toegangscode" value={v}
      onChange={e=>{setV(e.target.value);setErr("");}} onKeyDown={e=>{if(e.key==='Enter')submit();}} />
    <div className="err">{err}</div>
    <button onClick={submit}>Openen</button>
  </div>;
}

/* ============ DATE PICKER ============ */
function DatePicker({value, onPick, onClose}){
  const init = fromDateStr(value);
  const [y,setY]=useState(init.getFullYear());
  const [m,setM]=useState(init.getMonth());
  const [sel,setSel]=useState(value);
  const first=new Date(y,m,1); let lead=(first.getDay()+6)%7; // Mon=0
  const dim=new Date(y,m+1,0).getDate();
  const cells=[]; for(let i=0;i<lead;i++)cells.push(null); for(let d=1;d<=dim;d++)cells.push(d);
  function shift(dir){ let nm=m+dir,ny=y; if(nm<0){nm=11;ny--;} if(nm>11){nm=0;ny++;} setM(nm);setY(ny); }
  return <div className="overlay" onClick={onClose}>
    <div className="sheet" onClick={e=>e.stopPropagation()} style={{minHeight:'auto',borderRadius:'0 0 0 0'}}>
      <div className="sheet-hdr"><div className="top"><div style={{width:40}}/><h2>Kies datum</h2><button className="icon-btn" onClick={onClose}><Icon name="x"/></button></div></div>
      <div className="sheet-body">
        <div className="cal">
          <div className="cal-top">
            <div className="m">{monthLabel(y,m)}</div>
            <div className="navs"><button onClick={()=>shift(-1)}><Icon name="cleft"/></button><button onClick={()=>shift(1)}><Icon name="cright"/></button></div>
          </div>
          <div className="dow">{DOW.map(d=><div key={d}>{d}</div>)}</div>
          <div className="days">
            {cells.map((d,i)=>{ if(d===null) return <div key={i}/>; const ds=toDateStr(new Date(y,m,d));
              return <button key={i} className={"day"+(ds===sel?" sel":"")} onClick={()=>setSel(ds)}>{d}</button>; })}
          </div>
        </div>
        <div className="save-bar" style={{padding:'16px 0 0'}}>
          <button className="save-x" onClick={onClose}><Icon name="x"/></button>
          <button className="save-btn" onClick={()=>onPick(sel)}>KIES</button>
        </div>
      </div>
    </div>
  </div>;
}

/* ============ ADD / EDIT SHEET ============ */
function AddSheet({profileId, editTx, onClose, onSaved, toast}){
  const [type,setType]=useState(editTx? editTx.type : 'uit');
  const [amount,setAmount]=useState(editTx? String(editTx.amount).replace('.',',') : '');
  const [catKey,setCatKey]=useState(editTx? editTx.category : null);
  const [desc,setDesc]=useState(editTx? (editTx.description||'') : '');
  const [dateStr,setDateStr]=useState(editTx? editTx.date : toDateStr(new Date()));
  const [showCat,setShowCat]=useState(false);
  const [showDate,setShowDate]=useState(false);
  const [touched,setTouched]=useState(false);
  const [busy,setBusy]=useState(false);

  const num = parseFloat((amount||'').replace(/\s/g,'').replace(',','.'));
  const amtValid = isFinite(num) && num>0;
  const cat = catKey? catOf(catKey):null;

  // reset category when switching type if it doesn't belong
  useEffect(()=>{ if(catKey && !CATS[type].some(c=>c.key===catKey)) setCatKey(null); },[type]);

  async function save(){
    setTouched(true);
    if(!amtValid){ return; }
    if(!catKey){ setShowCat(true); return; }
    setBusy(true);
    const payload={ profile_id:profileId, type, amount:Math.round(num*100)/100, category:catKey, description: desc.trim()||null, date:dateStr };
    let res;
    if(editTx){ res=await db.from('budget_transactions').update(payload).eq('id',editTx.id); }
    else{ res=await db.from('budget_transactions').insert(payload); }
    setBusy(false);
    if(res.error){ toast('Fout bij opslaan'); return; }
    onSaved(); onClose();
  }
  async function del(){
    if(!editTx) return;
    if(!window.confirm('Deze transactie verwijderen?')) return;
    setBusy(true);
    const res=await db.from('budget_transactions').delete().eq('id',editTx.id);
    setBusy(false);
    if(res.error){ toast('Fout bij verwijderen'); return; }
    onSaved(); onClose();
  }

  return <div className="overlay" onClick={onClose}>
    <div className="sheet full" onClick={e=>e.stopPropagation()}>
      <div className="sheet-hdr">
        <div className="top"><div style={{width:40}}/><h2>{editTx?'Bewerken':'Voeg toe'}</h2><button className="icon-btn" onClick={onClose}><Icon name="x"/></button></div>
        <div className="seg">
          <button className={type==='in'?'on':''} onClick={()=>setType('in')}>IN</button>
          <button className={type==='uit'?'on':''} onClick={()=>setType('uit')}>UIT</button>
        </div>
      </div>
      <div className="sheet-body">
        <div className={"amount-box"+(touched&&!amtValid?' err':'')}>
          <span className="eur" style={{color: amount? (type==='in'?'var(--green)':'var(--red)') : undefined}}>€</span>
          <input className="amount-inp" inputMode="decimal" placeholder="0" value={amount}
            style={{color: amount? (type==='in'?'var(--green)':'var(--red)') : undefined}}
            onChange={e=>{ setAmount(e.target.value.replace(/[^0-9.,]/g,'')); }} />
        </div>
        {touched&&!amtValid && <div className="helper">Gelieve een bedrag in te geven</div>}

        <button className="row" onClick={()=>setShowCat(true)}>
          <div className={"ic"+(cat?' filled':'')} style={cat?{background:cat.color}:{}}><Icon name={cat?cat.icon:'clip'} size={22}/></div>
          <div className={"txt"+(cat?'':' ph')}>{cat? cat.label : 'Kies categorie'}</div>
          <div className="chev"><Icon name="cright" size={20}/></div>
        </button>

        <div className="row">
          <div className="ic"><Icon name="receipt" size={22}/></div>
          <input className="desc" placeholder="Geef omschrijving" value={desc} onChange={e=>setDesc(e.target.value)} />
        </div>

        <button className="row" onClick={()=>setShowDate(true)}>
          <div className="ic"><Icon name="cal" size={22}/></div>
          <div className="txt">{fromDateStr(dateStr).getDate()} {MONTHS[fromDateStr(dateStr).getMonth()].slice(0,3)} {fromDateStr(dateStr).getFullYear()}</div>
          <div className="chev"><Icon name="cright" size={20}/></div>
        </button>

        <div className="save-bar">
          <button className="save-x" onClick={onClose}><Icon name="x"/></button>
          <button className="save-btn" disabled={busy} onClick={save}>{busy?'...':'OPSLAAN'}</button>
        </div>
        {editTx && <button className="del-btn" onClick={del}>Verwijder transactie</button>}
      </div>
    </div>
    {showCat && <CategoryPicker type={type} onPick={k=>{setCatKey(k);setShowCat(false);}} onClose={()=>setShowCat(false)} />}
    {showDate && <DatePicker value={dateStr} onPick={d=>{setDateStr(d);setShowDate(false);}} onClose={()=>setShowDate(false)} />}
  </div>;
}

/* ============ BUDGET TAB ============ */
function TxRow({tx, onClick}){
  const c=catOf(tx.category);
  return <div className="tx" onClick={onClick}>
    <div className="ic" style={{background:c.color}}><Icon name={c.icon} size={22}/></div>
    <div className="mid">
      <div className="cat">{c.label}</div>
      {tx.description && <div className="desc">{tx.description}</div>}
    </div>
    <div className="right">
      <div className={"amt "+(tx.type==='in'?'in':'out')}>{tx.type==='in'?'+ ':'- '}{fmtNum(tx.amount)}</div>
      <div className="dt">{ddmmyy(tx.date)}</div>
    </div>
  </div>;
}

function BudgetTab({txAll, y, m, setYM, onOpenTx, onOpenStat}){
  const mk=monthKey(y,m);
  const mtx=useMemo(()=> txAll.filter(t=>t.date.startsWith(mk)).sort((a,b)=> a.date!==b.date? (a.date<b.date?1:-1) : (a.created_at<b.created_at?1:-1)), [txAll,mk]);
  const income=mtx.filter(t=>t.type==='in').reduce((s,t)=>s+Number(t.amount),0);
  const expense=mtx.filter(t=>t.type==='uit').reduce((s,t)=>s+Number(t.amount),0);
  const saldo=income-expense; const tot=income+expense;
  function shift(d){ let nm=m+d,ny=y; if(nm<0){nm=11;ny--;} if(nm>11){nm=0;ny++;} setYM(ny,nm); }
  return <div>
    <div className="hdr">
      <div className="hdr-row">
        <button className="icon-btn" onClick={()=>shift(-1)}><Icon name="aleft"/></button>
        <div><div className="hdr-title">Jouw budget</div><div className="hdr-sub">{monthLabel(y,m)}</div></div>
        <button className="icon-btn" onClick={()=>shift(1)}><Icon name="aright"/></button>
      </div>
    </div>
    <div className={"balance "+(saldo>=0?'pos':'neg')}>{fmtSigned(saldo)}</div>
    <div className="wrap">
      <div className="cards2">
        <div className="stat" onClick={()=>onOpenStat('in')}>
          <div className="chev"><Icon name="cright" size={18}/></div>
          <MiniDonut frac={tot? income/tot:0} color="#5FD9C0"/>
          <div className="lbl">INKOMSTEN</div>
          <div className="val">€ {fmtNum(income)}</div>
        </div>
        <div className="stat" onClick={()=>onOpenStat('uit')}>
          <div className="chev"><Icon name="cright" size={18}/></div>
          <MiniDonut frac={tot? expense/tot:0} color="#FF8787"/>
          <div className="lbl">UITGAVEN</div>
          <div className="val">€ - {fmtNum(expense)}</div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-h"><h3>Transacties</h3><span className="count">({mtx.length})</span></div>
        {mtx.length===0
          ? <div className="empty">Nog geen transacties deze maand.<br/>Tik op + om er een toe te voegen.</div>
          : mtx.map(t=> <TxRow key={t.id} tx={t} onClick={()=>onOpenTx(t)} />)}
      </div>
    </div>
  </div>;
}

/* ============ OVERZICHT TAB ============ */
function OverzichtTab({txAll, state, setState, onOpenTx}){
  const {y,m,type,cat}=state;
  const mk=monthKey(y,m);
  const mtx=useMemo(()=> txAll.filter(t=>t.date.startsWith(mk) && t.type===type), [txAll,mk,type]);
  const groups=useMemo(()=>{
    const map={};
    mtx.forEach(t=>{ (map[t.category]=map[t.category]||{value:0,items:[]}); map[t.category].value+=Number(t.amount); map[t.category].items.push(t); });
    return Object.entries(map).map(([k,v])=>({key:k, ...v, ...catOf(k)})).sort((a,b)=>b.value-a.value);
  },[mtx]);
  const total=groups.reduce((s,g)=>s+g.value,0);
  function shift(d){ let nm=m+d,ny=y; if(nm<0){nm=11;ny--;} if(nm>11){nm=0;ny++;} setState({...state,y:ny,m:nm,cat:null}); }

  // Category detail
  if(cat){
    const g=groups.find(x=>x.key===cat);
    const items=(g?g.items:[]).slice().sort((a,b)=> a.date!==b.date? (a.date<b.date?1:-1) : (a.created_at<b.created_at?1:-1));
    return <div>
      <div className="hdr"><div className="hdr-row">
        <button className="icon-btn" onClick={()=>setState({...state,cat:null})}><Icon name="aleft"/></button>
        <div><div className="hdr-title">{catOf(cat).label}</div><div className="hdr-sub">{monthLabel(y,m)}</div></div>
        <div style={{width:40}}/>
      </div></div>
      <div className={"balance "+(type==='in'?'pos':'neg')}>{type==='in'?'€ + ':'€ - '}{fmtNum(g?g.value:0)}</div>
      <div className="wrap"><div className="panel">
        <div className="panel-h"><h3>Transacties</h3><span className="count">({items.length})</span></div>
        {items.map(t=><TxRow key={t.id} tx={t} onClick={()=>onOpenTx(t)} />)}
      </div></div>
    </div>;
  }

  return <div>
    <div className="hdr"><div className="hdr-row">
      <button className="icon-btn" onClick={()=>shift(-1)}><Icon name="aleft"/></button>
      <div><div className="hdr-title">Overzicht</div><div className="hdr-sub">{monthLabel(y,m)}</div></div>
      <button className="icon-btn" onClick={()=>shift(1)}><Icon name="aright"/></button>
    </div></div>
    <div className="wrap">
      <div className="toggle2">
        <button className={type==='uit'?'on':''} onClick={()=>setState({...state,type:'uit',cat:null})}>Uitgaven</button>
        <button className={type==='in'?'on':''} onClick={()=>setState({...state,type:'in',cat:null})}>Inkomsten</button>
      </div>
      <div className="panel" style={{marginTop:14}}>
        {groups.length===0
          ? <div className="empty">Geen {type==='in'?'inkomsten':'uitgaven'} deze maand.</div>
          : <div style={{padding:'8px 16px 14px'}}>
              <div className="donut-wrap">
                <BigDonut items={groups} total={total}/>
                <div style={{marginTop:8,fontWeight:800,fontSize:18}}>{type==='in'?'€ ':'€ '}{fmtNum(total)}</div>
              </div>
              <div className="legend">
                {groups.map(g=>(
                  <div className="leg" key={g.key} onClick={()=>setState({...state,cat:g.key})}>
                    <div className="dot" style={{background:g.color}}><Icon name={g.icon} size={18}/></div>
                    <div className="nm">{g.label}</div>
                    <div className="pc">{total? Math.round(g.value/total*100):0}%</div>
                    <div className="vv">{fmtNum(g.value)}</div>
                    <div className="chev" style={{marginLeft:6}}><Icon name="cright" size={18}/></div>
                  </div>
                ))}
              </div>
            </div>}
      </div>
    </div>
  </div>;
}

/* ============ PROFIELEN TAB ============ */
function ProfielenTab({profiles, activeId, setActive, onRename}){
  const [names,setNames]=useState({});
  useEffect(()=>{ const n={}; profiles.forEach(p=>n[p.id]=p.name); setNames(n); },[profiles]);
  return <div>
    <div className="hdr"><div className="hdr-row"><div style={{width:40}}/><div className="hdr-title">Profielen</div><div style={{width:40}}/></div></div>
    <div className="wrap">
      <div className="note"><h4>3 aparte rekeningen</h4><p>Elk profiel houdt zijn eigen inkomsten en uitgaven bij. Tik op een profiel om het actief te maken. Wijzigingen zien jullie allebei meteen.</p></div>
      {profiles.map(p=>(
        <div className={"pf"+(p.id===activeId?' active':'')} key={p.id}>
          <div className="av" onClick={()=>setActive(p.id)}>{(names[p.id]||'?').trim().charAt(0).toUpperCase()||'?'}</div>
          <input value={names[p.id]!==undefined?names[p.id]:p.name}
            onChange={e=>setNames({...names,[p.id]:e.target.value})}
            onBlur={e=>{ const v=e.target.value.trim(); if(v && v!==p.name) onRename(p.id,v); }} />
          {p.id===activeId ? <span className="pick">ACTIEF</span> : <button className="pick" style={{color:'#b6b6c2'}} onClick={()=>setActive(p.id)}>KIES</button>}
        </div>
      ))}
    </div>
  </div>;
}

/* ============ APP ROOT ============ */
function App(){
  const [ok,setOk]=useState(localStorage.getItem('budget_ok')==='1');
  const [profiles,setProfiles]=useState([]);
  const [activeId,setActiveId]=useState(localStorage.getItem('budget_profile')||null);
  const [txAll,setTxAll]=useState([]);
  const [tab,setTab]=useState('budget');
  const now=new Date();
  const [ym,setYm]=useState({y:now.getFullYear(), m:now.getMonth()});
  const [ovz,setOvz]=useState({y:now.getFullYear(), m:now.getMonth(), type:'uit', cat:null});
  const [addOpen,setAddOpen]=useState(false);
  const [editTx,setEditTx]=useState(null);
  const [toastMsg,setToastMsg]=useState('');
  const [loading,setLoading]=useState(true);
  const toast=useCallback((msg)=>{ setToastMsg(msg); setTimeout(()=>setToastMsg(''),1800); },[]);

  const loadProfiles=useCallback(async()=>{
    const {data}=await db.from('budget_profiles').select('*').order('position');
    if(data){ setProfiles(data); setActiveId(prev=>{ const keep=prev&&data.some(p=>p.id===prev); return keep?prev:(data[0]?data[0].id:null); }); }
  },[]);
  const loadTx=useCallback(async(pid)=>{
    if(!pid){ setTxAll([]); return; }
    const {data}=await db.from('budget_transactions').select('*').eq('profile_id',pid);
    setTxAll(data||[]); setLoading(false);
  },[]);

  useEffect(()=>{ if(ok) loadProfiles(); },[ok]);
  useEffect(()=>{ if(activeId){ localStorage.setItem('budget_profile',activeId); loadTx(activeId); } },[activeId]);

  // realtime
  useEffect(()=>{
    if(!ok) return;
    const ch=db.channel('budget-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'budget_transactions'},()=>{ setActiveId(a=>{ if(a) loadTx(a); return a; }); })
      .on('postgres_changes',{event:'*',schema:'public',table:'budget_profiles'},()=>{ loadProfiles(); })
      .subscribe();
    return ()=>{ db.removeChannel(ch); };
  },[ok]);

  async function renameProfile(id,name){ await db.from('budget_profiles').update({name}).eq('id',id); loadProfiles(); }
  function openStat(type){ setOvz({...ovz, y:ym.y, m:ym.m, type, cat:null}); setTab('overzicht'); }

  if(!ok) return <Gate onOk={()=>setOk(true)} />;

  return <div className="app">
    {tab==='budget' && <BudgetTab txAll={txAll} y={ym.y} m={ym.m}
      setYM={(y,m)=>setYm({y,m})} onOpenTx={t=>{setEditTx(t);setAddOpen(true);}} onOpenStat={openStat} />}
    {tab==='overzicht' && <OverzichtTab txAll={txAll} state={ovz} setState={setOvz} onOpenTx={t=>{setEditTx(t);setAddOpen(true);}} />}
    {tab==='profielen' && <ProfielenTab profiles={profiles} activeId={activeId} setActive={setActiveId} onRename={renameProfile} />}

    <div className="nav"><div className="nav-inner">
      <button className={"nav-btn"+(tab==='budget'?' on':'')} onClick={()=>setTab('budget')}><Icon name="eye" size={24} sw={2.2}/><span>Budget</span></button>
      <button className={"nav-btn"+(tab==='overzicht'?' on':'')} onClick={()=>setTab('overzicht')}><Icon name="chart" size={24} sw={2.2}/><span>Overzicht</span></button>
      <div className="nav-spacer"/>
      <button className={"nav-btn"+(tab==='profielen'?' on':'')} onClick={()=>setTab('profielen')}><Icon name="users" size={24} sw={2.2}/><span>Profielen</span></button>
      <div className="fab" onClick={()=>{ if(!activeId){toast('Maak eerst een profiel actief');return;} setEditTx(null); setAddOpen(true); }}><Icon name="plus" size={30} sw={2.6}/></div>
    </div></div>

    {addOpen && <AddSheet profileId={activeId} editTx={editTx}
      onClose={()=>{setAddOpen(false);setEditTx(null);}}
      onSaved={()=>loadTx(activeId)} toast={toast} />}

    {toastMsg && <div className="toast">{toastMsg}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
