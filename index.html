ircle%20cx%3D%22360%22%20cy%3D%22290%22%20r%3D%222.6%22%20fill%3D%22%23F1A9BD%22%2F%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%22400%22%20r%3D%222.6%22%20fill%3D%22%2379D6C1%22%2F%3E%3Ccircle%20cx%3D%22250%22%20cy%3D%22320%22%20r%3D%222.6%22%20fill%3D%22%23EFD289%22%2F%3E%3Ccircle%20cx%3D%22110%22%20cy%3D%22470%22%20r%3D%222.6%22%20fill%3D%22%23A6C4EE%22%2F%3E%3Ccircle%20cx%3D%22360%22%20cy%3D%22500%22%20r%3D%222.6%22%20fill%3D%22%23B4A4F2%22%2F%3E%3Ccircle%20cx%3D%22200%22%20cy%3D%22120%22%20r%3D%222.6%22%20fill%3D%22%23C4C4D2%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");background-size:200px auto;background-repeat:repeat;position:relative;overflow-x:hidden;padding-bottom:96px;}
  .safe-top{padding-top:env(safe-area-inset-top);}

  /* Header */
  .hdr{background:var(--purple);color:#fff;border-radius:0 0 30px 30px;padding:calc(env(safe-area-inset-top) + 14px) 20px 26px;position:relative;}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .hdr-title{font-size:23px;font-weight:800;text-align:center;line-height:1.15;}
  .hdr-sub{font-size:16px;font-weight:500;text-align:center;opacity:.95;text-transform:lowercase;margin-top:6px;}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}
  .icon-btn:active{background:rgba(255,255,255,.15);}

  /* Balance pill */
  .balance{background:#fff;margin:12px auto 0;width:max-content;min-width:230px;text-align:center;padding:16px 34px;border-radius:40px;box-shadow:0 8px 24px rgba(60,50,120,.12);font-size:40px;font-weight:800;letter-spacing:-.5px;}
  .balance.pos{color:var(--green);} .balance.neg{color:var(--red);}

  .wrap{padding:18px 16px 0;}
  .cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .stat{background:#fff;border-radius:20px;padding:16px 12px 14px;text-align:center;position:relative;box-shadow:0 4px 14px rgba(60,50,120,.05);}
  .stat .lbl{font-size:13px;color:var(--muted);letter-spacing:.6px;margin-top:8px;font-weight:600;}
  .stat .val{font-size:18px;font-weight:800;margin-top:2px;}
  .stat .chev{position:absolute;top:12px;right:12px;color:#c9c9d4;}

  .panel{background:#fff;border-radius:20px;margin-top:16px;padding:6px 0 4px;box-shadow:0 4px 14px rgba(60,50,120,.05);overflow:hidden;}
  .panel-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px 8px;}
  .panel-h h3{margin:0;font-size:20px;font-weight:800;}
  .panel-h .count{color:var(--muted);font-weight:700;font-size:15px;}

  .tx{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);}
  .tx:first-child{border-top:none;}
  .tx:active{background:#f7f7fb;}
  .tx .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}
  .tx .mid{flex:1;min-width:0;}
  .tx .cat{font-weight:800;font-size:15.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx .desc{color:var(--muted);font-size:13.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx .right{text-align:right;flex:0 0 auto;}
  .tx .amt{font-weight:800;font-size:15.5px;}
  .tx .amt.in{color:var(--green);} .tx .amt.out{color:var(--red);}
  .tx .dt{color:var(--muted);font-size:12.5px;margin-top:2px;}

  .empty{padding:34px 20px;text-align:center;color:var(--muted);}

  .note{background:#fff;border-radius:16px;padding:16px 18px;margin-top:14px;box-shadow:0 4px 14px rgba(60,50,120,.05);}
  .note h4{margin:0 0 6px;font-size:17px;} .note p{margin:0;color:#5b5b68;font-size:14.5px;line-height:1.5;}

  /* Bottom nav + FAB */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;}
  .nav-inner{max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e9e9f0;display:flex;justify-content:space-between;align-items:flex-end;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;color:#b6b6c2;font-size:11px;font-weight:700;flex:1;min-width:0;padding-top:4px;white-space:nowrap;}
  .nav-btn.on{color:var(--ink);}
  .nav-spacer{flex:1;}
  .fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:62px;height:62px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(123,87,255,.45);}
  .fab:active{transform:translateX(-50%) scale(.94);}

  /* Sheet / modal */
  .overlay{position:fixed;inset:0;background:rgba(20,18,40,.35);z-index:60;display:flex;flex-direction:column;}
  .sheet{background:var(--bg);margin-top:auto;min-height:70vh;max-height:100vh;border-radius:0;display:flex;flex-direction:column;animation:up .22s ease;}
  .sheet.full{min-height:100vh;}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet-hdr{background:var(--purple);color:#fff;border-radius:0 0 30px 30px;padding:calc(env(safe-area-inset-top) + 14px) 18px 22px;}
  .sheet-hdr .top{display:flex;align-items:center;justify-content:space-between;}
  .sheet-hdr h2{margin:0;font-size:22px;font-weight:800;flex:1;text-align:center;}
  .seg{display:flex;gap:10px;margin-top:18px;}
  .seg button{flex:1;padding:12px 0;border-radius:30px;font-weight:800;font-size:16px;border:1.5px solid rgba(255,255,255,.6);color:#fff;}
  .seg button.on{background:#fff;color:var(--purple);border-color:#fff;}

  .sheet-body{padding:16px;overflow-y:auto;flex:1;}
  .amount-box{background:#fff;border-radius:22px;padding:20px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(60,50,120,.05);}

function fmtNum(n){ return Math.abs(n).toLocaleString('nl-BE',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtSigned(n){ const s = n>0?'+ ':(n<0?'- ':''); return '€ '+s+fmtNum(n); }
function pad(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fromDateStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function ddmmyy(s){ const [y,m,d]=s.split('-'); return `${d}/${m}/${y.slice(2)}`; }

function MiniDonut({frac, color}){
  const r=27, c=2*Math.PI*r, f=Math.max(0,Math.min(1,frac||0));
  return <svg width="76" height="76" viewBox="0 0 76 76">
    <circle cx="38" cy="38" r={r} fill="none" stroke="#EDEDF2" strokeWidth="9"/>
    {f>0 && <circle cx="38" cy="38" r={r} fill="none" stroke={color} strokeWidth="9"
      strokeLinecap="round" strokeDasharray={`${c*f} ${c}`} strokeDashoffset="0"
      transform="rotate(-90 38 38)"/>}
  </svg>;
}
function BigDonut({items, total}){
  const r=52, c=2*Math.PI*r; let acc=0;
  return <svg width="168" height="168" viewBox="0 0 168 168">
    <circle cx="84" cy="84" r={r} fill="none" stroke="#EDEDF2" strokeWidth="26"/>
    {total>0 && items.map((it,i)=>{
      const len=c*(it.value/total);
      const el=<circle key={i} cx="84" cy="84" r={r} fill="none" stroke={it.color} strokeWidth="26"
        strokeDasharray={`${len} ${c-len}`} strokeDashoffset={-acc} transform="rotate(-90 84 84)"/>;
      acc+=len; return el;
    })}
  </svg>;
}

  const cells=[]; for(let i=0;i<lead;i++)cells.push(null); for(let d=1;d<=dim;d++)cells.push(d);
  function shift(dir){ let nm=m+dir,ny=y; if(nm<0){nm=11;ny--;} if(nm>11){nm=0;ny++;} setM(nm);setY(ny); }
  return <div className="overlay" onClick={onClose}>

function AddSheet({profileId, editTx, savings, onCreatePot, preset, onClose, onSaved, toast}){
  const isSpaar = editTx? (editTx.category==='sparen') : (preset? preset.type==='sparen' : false);
  const [type,setType]=useState(editTx? (isSpaar?'sparen':editTx.type) : (preset? preset.type : 'uit'));
  const [dir,setDir]=useState(editTx&&isSpaar? (editTx.type==='uit'?'storten':'opnemen') : (preset&&preset.dir? preset.dir : 'storten'));
  const [savId,setSavId]=useState(editTx? (editTx.savings_id||null) : (preset? (preset.savId||null) : null));
  const [amount,setAmount]=useState(editTx? String(editTx.amount).replace('.',',') : '');
  const [catKey,setCatKey]=useState(editTx&&!isSpaar? editTx.category : null);
  const [desc,setDesc]=useState(editTx? (editTx.description||'') : '');
  const [dateStr,setDateStr]=useState(editTx? editTx.date : toDateStr(new Date()));
  const [showCat,setShowCat]=useState(false);
  const [showSav,setShowSav]=useState(false);
  const [showName,setShowName]=useState(false);
  const [showDate,setShowDate]=useState(false);
  const [touched,setTouched]=useState(false);
  const [busy,setBusy]=useState(false);

  const num = parseFloat((amount||'').replace(/\s/g,'').replace(',','.'));
  const amtValid = isFinite(num) && num>0;
  const cat = catKey? catOf(catKey):null;
  const pot = savId? (savings||[]).find(s=>s.id===savId) : null;
  const amtColor = amount? (type==='in'?'var(--green)': type==='uit'?'var(--red)': (dir==='opnemen'?'var(--green)':'var(--red)')) : undefined;

  useEffect(()=>{ if((type==='in'||type==='uit') && catKey && !CATS[type].some(c=>c.key===catKey)) setCatKey(null); },[type]);

  async function save(){
    setTouched(true);
    if(!amtValid){ return; }
    if(type==='sparen'){ if(!savId){ setShowSav(true); return; } }
    else if(!catKey){ setShowCat(true); return; }
    setBusy(true);
    const a=Math.round(num*100)/100;
    let payload;
    if(type==='sparen'){
      const pn=pot? pot.name : '';
      payload={ profile_id:profileId, type:(dir==='storten'?'uit':'in'), amount:a, category:'sparen', description: desc.trim() || ((dir==='storten'?'→ ':'← ')+pn), date:dateStr, savings_id:savId };
    } else {
      payload={ profile_id:profileId, type, amount:a, category:catKey, description: desc.trim()||null, date:dateStr, savings_id:null };
    }
    let res = editTx ? await db.from('budget_transactions').update(payload).eq('id',editTx.id) : await db.from('budget_transactions').insert(payload);
    setBusy(false);
    if(res.error){ toast('Fout bij opslaan'); return; }
    onSaved(); onClose();
  }
  async function del(){
    if(!editTx) return;
    if(!window.confirm('Deze transactie verwijderen?')) return;
    setBusy(true);
    const res=await db.from('budget_transactions').delete().eq('id',editTx.id);
    setBusy(false);
    if(res.error){ toast('Fout bij verwijderen'); return; }
    onSaved(); onClose();
  }

  return <div className="overlay" onClick={onClose}>
    <div className="sheet full" onClick={e=>e.stopPropagation()}>
      <div className="sheet-hdr">
        <div className="top"><div style={{width:40}}/><h2>{editTx?'Bewerken':'Voeg toe'}</h2><button className="icon-btn" onClick={onClose}><Icon name="x"/></button></div>
        <div className="seg">
          <button className={type==='in'?'on':''} onClick={()=>setType('in')}>IN</button>
          <button className={type==='uit'?'on':''} onClick={()=>setType('uit')}>UIT</button>
          <button className={type==='sparen'?'on':''} onClick={()=>setType('sparen')}>SPAREN</button>
        </div>
      </div>
      <div className="sheet-body">
        <div className={"amount-box"+(touched&&!amtValid?' err':'')}>
          <span className="eur" style={{color:amtColor}}>€</span>
          <input className="amount-inp" inputMode="decimal" placeholder="0" value={amount}
            style={{color:amtColor}}
            onChange={e=>{ setAmount(e.target.value.replace(/[^0-9.,]/g,'')); }} />
        </div>
        {touched&&!amtValid && <div className="helper">Gelieve een bedrag in te geven</div>}

        {type==='sparen' && <div className="toggle2" style={{marginTop:12}}>
          <button className={dir==='storten'?'on':''} onClick={()=>setDir('storten')}>Storten</button>
          <button className={dir==='opnemen'?'on':''} onClick={()=>setDir('opnemen')}>Opnemen</button>
        </div>}

        <div className="field-card">
        {type==='sparen'
          ? <button className="row" onClick={()=>setShowSav(true)}>
              <div className={"ic"+(pot?' filled':'')} style={pot?{background:'#7B57FF'}:{}}><Icon name="piggy" size={22}/></div>
              <div className={"txt"+(pot?'':' ph')}>{pot? pot.name : 'Kies spaarrekening'}</div>
              <div className="chev"><Icon name="cright" size={20}/></div>
            </button>
          : <button className="row" onClick={()=>setShowCat(true)}>
              <div className={"ic"+(cat?' filled':'')} style={cat?{background:cat.color}:{}}><Icon name={cat?cat.icon:'clip'} size={22}/></div>
              <div className={"txt"+(cat?'':' ph')}>{cat? cat.label : 'Kies categorie'}</div>
              <div className="chev"><Icon name="cright" size={20}/></div>
            </button>}

        <div className="row">
          <div className="ic"><Icon name="receipt" size={22}/></div>
          <input className="desc" placeholder="Geef omschrijving" value={desc} onChange={e=>setDesc(e.target.value)} />
        </div>

        <button className="row" onClick={()=>setShowDate(true)}>
          <div className="ic"><Icon name="cal" size={22}/></div>
          <div className="txt">{fromDateStr(dateStr).getDate()} {MONTHS[fromDateStr(dateStr).getMonth()].slice(0,3)} {fromDateStr(dateStr).getFullYear()}</div>
          <div className="chev"><Icon name="cright" size={20}/></div>
        </button>
        </div>

        <div className="save-bar">
          <button className="save-x" onClick={onClose}><Icon name="x"/></button>
          <button className="save-btn" disabled={busy} onClick={save}>{busy?'...':'OPSLAAN'}</button>
        </div>
        {editTx && <button className="del-btn" onClick={del}>Verwijder transactie</button>}
      </div>
    </div>
    {showCat && <CategoryPicker type={type} current={catKey} onPick={k=>{setCatKey(k);setShowCat(false);}} onClose={()=>setShowCat(false)} />}
    {showSav && <SavingsPicker savings={savings||[]} onPick={id=>{setSavId(id);setShowSav(false);}} onNew={()=>setShowName(true)} onClose={()=>setShowSav(false)} />}
    {showName && <NameModal title="Nieuwe spaarrekening" onSave={async(nm)=>{ const id=await onCreatePot(nm); if(id) setSavId(id); setShowName(false); setShowSav(false); }} onClose={()=>setShowName(false)} />}
    {showDate && <DatePicker value={dateStr} onPick={d=>{setDateStr(d);setShowDate(false);}} onClose={()=>setShowDate(false)} />}
  </div>;
}

function BudgetTab({txAll, y, m, setYM, onOpenTx, onOpenStat}){
  const mk=monthKey(y,m);
  const mtx=useMemo(()=> txAll.filter(t=>t.date.startsWith(mk)).sort((a,b)=> a.date!==b.date? (a.date<b.date?1:-1) : (a.created_at<b.created_at?1:-1)), [txAll,mk]);
  const income=mtx.filter(t=>t.type==='in').reduce((s,t)=>s+Number(t.amount),0);
  const expense=mtx.filter(t=>t.type==='uit').reduce((s,t)=>s+Number(t.amount),0);
  const saldo=income-expense; const tot=income+expense;
  function shift(d){ let nm=m+d,ny=y; if(nm<0){nm=11;ny--;} if(nm>11){nm=0;ny++;} setYM(ny,nm); }
  return <div>
    <div className="hdr">
      <div className="hdr-row">
        <button className="icon-btn" onClick={()=>shift(-1)}><Icon name="aleft"/></button>

        <button className="icon-btn" onClick={()=>shift(1)}><Icon name="aright"/></button>
      </div>
    </div>
    <div className={"balance "+(saldo>=0?'pos':'neg')}>{fmtSigned(saldo)}</div>
    <div className="wrap">
      <div className="cards2">
        <div className="stat" onClick={()=>onOpenStat('in')}>
          <div className="chev"><Icon name="cright" size={18}/></div>
          <MiniDonut frac={tot? income/tot:0} color="#5FD9C0"/>
          <div className="lbl">INKOMSTEN</div>
          <div className="val">€ {fmtNum(income)}</div>
        </div>
        <div className="stat" onClick={()=>onOpenStat('uit')}>
          <div className="chev"><Icon name="cright" size={18}/></div>
          <MiniDonut frac={tot? expense/tot:0} color="#FF8787"/>
          <div className="lbl">UITGAVEN</div>
          <div className="val">€ - {fmtNum(expense)}</div>
        </div>
      </div>

          : mtx.map(t=> <TxRow key={t.id} tx={t} onClick={()=>onOpenTx(t)} />)}
      </div>
    </div>
  </div>;
}

/* ============ OVERZICHT TAB ============ */
function OverzichtTab({txAll, state, setState, onOpenTx}){
  const {y,m,type,cat}=state;
  const mk=monthKey(y,m);
  const mtx=useMemo(()=> txAll.filter(t=>t.date.startsWith(mk) && t.type===type), [txAll,mk,type]);
  const groups=useMemo(()=>{
    const map={};
    mtx.forEach(t=>{ (map[t.category]=map[t.category]||{value:0,items:[]}); map[t.category].value+=Number(t.amount); map[t.category].items.push(t); });
    return Object.entries(map).map(([k,v])=>({key:k, ...v, ...catOf(k)})).sort((a,b)=>b.value-a.value);
  },[mtx]);
  const total=groups.reduce((s,g)=>s+g.value,0);
  function shift(d){ let nm=m+d,ny=y; if(nm<0){nm=11;ny--;} if(nm>11){nm=0;ny++;} setState({...state,y:ny,m:nm,cat:null}); }

  // Category detail
  if(cat){
    const g=groups.find(x=>x.key===cat);
    const items=(g?g.items:[]).slice().sort((a,b)=> a.date!==b.date? (a.date<b.date?1:-1) : (a.created_at<b.created_at?1:-1));
    return <div>
      <div className="hdr"><div className="hdr-row">
        <button className="icon-btn" onClick={()=>setState({...state,cat:null})}><Icon name="aleft"/></button>
        <div><div className="hdr-title">{catOf(cat).label}</div><div className="hdr-sub">{monthLabel(y,m)}</div></div>
        <div style={{width:40}}/>
      </div></div>
      <div className={"balance "+(type==='in'?'pos':'neg')}>{type==='in'?'€ + ':'€ - '}{fmtNum(g?g.value:0)}</div>
      <div className="wrap"><div className="panel">
        <div className="panel-h"><h3>Transacties</h3><span className="count">({items.length})</span></div>
        {items.map(t=><TxRow key={t.id} tx={t} onClick={()=>onOpenTx(t)} />)}
      </div></div>
    </div>;
  }

  return <div>
    <div className="hdr"><div className="hdr-row">
      <button className="icon-btn" onClick={()=>shift(-1)}><Icon name="aleft"/></button>
      <div><div className="hdr-title">Overzicht</div><div className="hdr-sub">{monthLabel(y,m)}</div></div>
      <button className="icon-btn" onClick={()=>shift(1)}><Icon name="aright"/></button>
    </div></div>
    <div className="wrap">
      <div className="toggle2">
        <button className={type==='uit'?'on':''} onClick={()=>setState({...state,type:'uit',cat:null})}>Uitgaven</button>
        <button className={type==='in'?'on':''} onClick={()=>setState({...state,type:'in',cat:null})}>Inkomsten</button>
      </div>
      <div className="panel" style={{marginTop:14}}>
        {groups.length===0
          ? <div className="empty">Geen {type==='in'?'inkomsten':'uitgaven'} deze maand.</div>
          : <div style={{padding:'8px 16px 14px'}}>
              <div className="donut-wrap">
                <BigDonut items={groups} total={total}/>
                <div style={{marginTop:8,fontWeight:800,fontSize:18}}>{type==='in'?'€ ':'€ '}{fmtNum(total)}</div>
              </div>
              <div className="legend">
                {groups.map(g=>(
                  <div className="leg" key={g.key} onClick={()=>setState({...state,cat:g.key})}>
                    <div className="dot" style={{background:g.color}}><Icon name={g.icon} size={18}/></div>
                    <div className="nm">{g.label}</div>
                    <div className="pc">{total? Math.round(g.value/total*100):0}%</div>
                    <div className="vv">{fmtNum(g.value)}</div>
                    <div className="chev" style={{marginLeft:6}}><Icon name="cright" size={18}/></div>
                  </div>
                ))}
              </div>
            </div>}
      </div>
    </div>
  </div>;
}

  const [catKey,setCatKey]=useState(editRule? editRule.category : null);

  const [day,setDay]=useState(editRule? String(editRule.day) : '1');
  const [showCat,setShowCat]=useState(false);
  const [touched,setTouched]=useState(false);
  const [busy,setBusy]=useState(false);
  const num=parseFloat((amount||'').replace(/\s/g,'').replace(',','.'));
  const amtValid=isFinite(num)&&num>0;
  const dNum=Math.min(31,Math.max(1, parseInt(day||'1',10)||1));
  const cat=catKey?catOf(catKey):null;
  useEffect(()=>{ if(catKey && !CATS[type].some(c=>c.key===catKey)) setCatKey(null); },[type]);

  async function save(){
    setTouched(true);
    if(!amtValid) return;
    if(!catKey){ setShowCat(true); return; }
    setBusy(true);
    const payload={ profile_id:profileId, type, amount:Math.round(num*100)/100, category:catKey, description:desc.trim()||null, day:dNum };
    let res = editRule? await db.from('budget_recurring').update(payload).eq('id',editRule.id) : await db.from('budget_recurring').insert(payload);
    setBusy(false);
    if(res.error){ toast('Fout bij opslaan'); return; }
    onSaved(); onClose();
  }
  async function del(){
    if(!editRule) return;
    if(!window.confirm('Vaste kost verwijderen? Reeds toegevoegde transacties blijven staan.')) return;
    await db.from('budget_recurring').delete().eq('id',editRule.id);
    onSaved(); onClose();
  }

  return <div className="overlay" onClick={onClose}>
    <div className="sheet full" onClick={e=>e.stopPropagation()}>
      <div className="sheet-hdr">
        <div className="top"><div style={{width:40}}/><h2>{editRule?'Vaste kost':'Nieuwe vaste kost'}</h2><button className="icon-btn" onClick={onClose}><Icon name="x"/></button></div>
        <div className="seg">
          <button className={type==='in'?'on':''} onClick={()=>setType('in')}>IN</button>
          <button className={type==='uit'?'on':''} onClick={()=>setType('uit')}>UIT</button>
        </div>
      </div>
      <div className="sheet-body">
        <div className={"amount-box"+(touched&&!amtValid?' err':'')}>
          <span className="eur" style={{color:amount?(type==='in'?'var(--green)':'var(--red)'):undefined}}>€</span>
          <input className="amount-inp" inputMode="decimal" placeholder="0" value={amount} style={{color:amount?(type==='in'?'var(--green)':'var(--red)'):undefined}} onChange={e=>setAmount(e.target.value.replace(/[^0-9.,]/g,''))} />
        </div>
        {touched&&!amtValid && <div className="helper">Gelieve een bedrag in te geven</div>}
        <div className="field-card">
        <button className="row" onClick={()=>setShowCat(true)}>
          <div className={"ic"+(cat?' filled':'')} style={cat?{background:cat.color}:{}}><Icon name={cat?cat.icon:'clip'} size={22}/></div>
          <div className={"txt"+(cat?'':' ph')}>{cat?cat.label:'Kies categorie'}</div>
          <div className="chev"><Icon name="cright" size={20}/></div>
        </button>
        <div className="row">
          <div className="ic"><Icon name="receipt" size={22}/></div>
          <input className="desc" placeholder="Omschrijving (bv. huur)" value={desc} onChange={e=>setDesc(e.target.value)} />
        </div>
        <div className="row">
          <div className="ic"><Icon name="refresh" size={22}/></div>
          <div style={{flex:1,fontWeight:600}}>Elke maand op dag</div>
          <input className="desc" inputMode="numeric" style={{textAlign:'right',maxWidth:60}} value={day} onChange={e=>setDay(e.target.value.replace(/[^0-9]/g,'').slice(0,2))} />
        </div>
        </div>
        <div className="save-bar">
          <button className="save-x" onClick={onClose}><Icon name="x"/></button>
          <button className="save-btn" disabled={busy} onClick={save}>{busy?'...':'OPSLAAN'}</button>
        </div>
        {editRule && <button className="del-btn" onClick={del}>Verwijder vaste kost</button>}
      </div>
    </div>
    {showCat && <CategoryPicker type={type} current={catKey} onPick={k=>{setCatKey(k);setShowCat(false);}} onClose={()=>setShowCat(false)} />}
  </div>;
}

function VasteKostenScreen({profileId, recurring, onSaved, onClose, toast}){
  const [edit,setEdit]=useState(undefined); // undefined=dicht, null=nieuw, obj=bewerken
  return <div className="overlay" onClick={onClose}>
    <div className="sheet full" onClick={e=>e.stopPropagation()} style={{background:'var(--bg)'}}>
      <div className="hdr" style={{borderRadius:0}}><div className="hdr-row">
        <button className="icon-btn" onClick={onClose}><Icon name="aleft"/></button>
        <div className="hdr-title">Vaste kosten</div>
        <div style={{width:40}}/>
      </div></div>
      <div className="sheet-body">
        <div className="note"><h4>Herhalende posten</h4><p>Loon, huur, abonnementen… worden elke maand automatisch toegevoegd op de gekozen dag.</p></div>
        {recurring.length===0 && <div className="empty">Nog geen vaste kosten.</div>}
        {recurring.map(r=>{ const c=catOf(r.category); return (
          <div className="row" key={r.id} onClick={()=>setEdit(r)}>
            <div className="ic filled" style={{background:c.color}}><Icon name={c.icon} size={22}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:800,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{c.label}{r.description?' · '+r.description:''}</div>
              <div style={{color:'var(--muted)',fontSize:13}}>Elke maand op dag {r.day}</div>
            </div>
            <div style={{fontWeight:800,color:r.type==='in'?'var(--green)':'var(--red)',marginLeft:8}}>{r.type==='in'?'+ ':'- '}{fmtNum(r.amount)}</div>
          </div>
        );})}
        <button className="save-btn" style={{width:'100%',marginTop:14}} onClick={()=>setEdit(null)}>+ Nieuwe vaste kost</button>
      </div>
    </div>
    {edit!==undefined && <RecurringSheet profileId={profileId} editRule={edit} onClose={()=>setEdit(undefined)} onSaved={()=>{ setEdit(undefined); onSaved(); }} toast={toast} />}
  </div>;
}

async function materializeRecurring(profileId, rules, txList){
  const now=new Date(); const cy=now.getFullYear(), cm=now.getMonth();
  const existing=new Set((txList||[]).filter(t=>t.recurring_id).map(t=>t.recurring_id+'|'+t.date));
  const rows=[];
  (rules||[]).filter(r=>r.active).forEach(r=>{
    const s=fromDateStr(r.start_date); let y=s.getFullYear(), m=s.getMonth();
    const floor=new Date(cy, cm-24, 1);
    if(new Date(y,m,1)<floor){ y=floor.getFullYear(); m=floor.getMonth(); }
    let guard=0;
    while((y<cy || (y===cy && m<=cm)) && guard<60){
      guard++;
      const dim=new Date(y,m+1,0).getDate();
      const ds=toDateStr(new Date(y,m,Math.min(r.day,dim)));
      if(!existing.has(r.id+'|'+ds)) rows.push({ profile_id:profileId, type:r.type, amount:r.amount, category:r.category, description:r.description, date:ds, recurring_id:r.id });
      m++; if(m>11){m=0;y++;}
    }
  });
  if(rows.length){ await db.from('budget_transactions').upsert(rows,{onConflict:'recurring_id,date',ignoreDuplicates:true}); return true; }
  return false;
}

/* ============ APP ROOT ============ */
function App(){
  const [ok,setOk]=useState(localStorage.getItem('budget_ok')==='1');
  const [profiles,setProfiles]=useState([]);
  const [activeId,setActiveId]=useState(localStorage.getItem('budget_profile')||null);
  const [txAll,setTxAll]=useState([]);
  const [savings,setSavings]=useState([]);
  const [recurring,setRecurring]=useState([]);
  const [tab,setTab]=useState('budget');
  const now=new Date();
  const [ym,setYm]=useState({y:now.getFullYear(), m:now.getMonth()});
  const [ovz,setOvz]=useState({y:now.getFullYear(), m:now.getMonth(), type:'uit', cat:null});
  const [addOpen,setAddOpen]=useState(false);
  const [editTx,setEditTx]=useState(null);
  const [addPreset,setAddPreset]=useState(null);
  const [screen,setScreen]=useState(null);
  const [toastMsg,setToastMsg]=useState('');
  const toast=useCallback((msg)=>{ setToastMsg(msg); setTimeout(()=>setToastMsg(''),1800); },[]);

  const loadProfiles=useCallback(async()=>{
    const {data}=await db.from('budget_profiles').select('*').order('position');
    if(data){ setProfiles(data); setActiveId(prev=>{ const keep=prev&&data.some(p=>p.id===prev); return keep?prev:(data[0]?data[0].id:null); }); }
  },[]);
  const loadSavings=useCallback(async(pid)=>{ const {data}=await db.from('budget_savings').select('*').eq('profile_id',pid).order('position'); setSavings(data||[]); },[]);
  const loadData=useCallback(async(pid)=>{
    if(!pid){ setTxAll([]); setSavings([]); setRecurring([]); return; }
    const [txR,svR,rcR]=await Promise.all([
      db.from('budget_transactions').select('*').eq('profile_id',pid),
      db.from('budget_savings').select('*').eq('profile_id',pid).order('position'),
      db.from('budget_recurring').select('*').eq('profile_id',pid).order('created_at'),
    ]);
    let tx=txR.data||[]; setSavings(svR.data||[]); setRecurring(rcR.data||[]);
    const did=await materializeRecurring(pid, rcR.data||[], tx);
    if(did){ const r2=await db.from('budget_transactions').select('*').eq('profile_id',pid); tx=r2.data||tx; }
    setTxAll(tx);
  },[]);

  useEffect(()=>{ if(ok) loadProfiles(); },[ok]);
  useEffect(()=>{ if(activeId){ localStorage.setItem('budget_profile',activeId); loadData(activeId); } },[activeId]);

  useEffect(()=>{
    if(!ok) return;
    const reload=()=>setActiveId(a=>{ if(a) loadData(a); return a; });
    const ch=db.channel('budget-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'budget_transactions'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'budget_savings'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'budget_recurring'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'budget_profiles'},()=>loadProfiles())
      .subscribe();
    return ()=>{ db.removeChannel(ch); };
  },[ok]);

  async function renameProfile(id,name){ await db.from('budget_profiles').update({name}).eq('id',id); loadProfiles(); }
  function openStat(type){ setOvz({...ovz, y:ym.y, m:ym.m, type, cat:null}); setTab('overzicht'); }
  async function createPot(name){ const {data}=await db.from('budget_savings').insert({profile_id:activeId,name,position:savings.length}).select().single(); if(activeId) loadSavings(activeId); return data?data.id:null; }
  async function renamePot(id,name){ await db.from('budget_savings').update({name}).eq('id',id); if(activeId) loadSavings(activeId); }
  async function deletePot(id){ await db.from('budget_savings').delete().eq('id',id); if(activeId) loadData(activeId); }
  function openAdd(preset){ setEditTx(null); setAddPreset(preset||null); setAddOpen(true); }
  function quickSpaar(potId,dir){ openAdd({type:'sparen',dir,savId:potId}); }
  const openTx=t=>{ setEditTx(t); setAddPreset(null); setAddOpen(true); };

  if(!ok) return <Gate onOk={()=>setOk(true)} />;

  return <div className="app">
    {tab==='budget' && <BudgetTab txAll={txAll} y={ym.y} m={ym.m}
      setYM={(y,m)=>setYm({y,m})} onOpenTx={openTx} onOpenStat={openStat} />}
    {tab==='sparen' && <SparenTab savings={savings} txAll={txAll} onCreate={createPot} onRename={renamePot} onDelete={deletePot} onQuick={quickSpaar} onOpenTx={openTx} />}
    {tab==='overzicht' && <OverzichtTab txAll={txAll} state={ovz} setState={setOvz} onOpenTx={openTx} />}
    {tab==='profielen' && <ProfielenTab profiles={profiles} activeId={activeId} setActive={setActiveId} onRename={renameProfile} onOpenRecurring={()=>setScreen('vastekosten')} onLogout={()=>{ localStorage.removeItem('budget_ok'); setOk(false); }} />}

    <div className="nav"><div className="nav-inner">
      <button className={"nav-btn"+(tab==='budget'?' on':'')} onClick={()=>setTab('budget')}><Icon name="eye" size={24} sw={2.2}/><span>Budget</span></button>
      <button className={"nav-btn"+(tab==='sparen'?' on':'')} onClick={()=>setTab('sparen')}><Icon name="piggy" size={24} sw={2}/><span>Sparen</span></button>
      <div className="nav-spacer"/>
      <button className={"nav-btn"+(tab==='overzicht'?' on':'')} onClick={()=>setTab('overzicht')}><Icon name="chart" size={24} sw={2.2}/><span>Overzicht</span></button>
      <button className={"nav-btn"+(tab==='profielen'?' on':'')} onClick={()=>setTab('profielen')}><Icon name="users" size={24} sw={2.2}/><span>Profielen</span></button>
      <div className="fab" onClick={()=>{ if(!activeId){toast('Maak eerst een profiel actief');return;} openAdd(null); }}><Icon name="plus" size={30} sw={2.6}/></div>
    </div></div>

    {addOpen && <AddSheet profileId={activeId} editTx={editTx} savings={savings} onCreatePot={createPot} preset={addPreset}
      onClose={()=>{setAddOpen(false);setEditTx(null);setAddPreset(null);}}
      onSaved={()=>loadData(activeId)} toast={toast} />}

    {screen==='vastekosten' && <VasteKostenScreen profileId={activeId} recurring={recurring} onSaved={()=>loadData(activeId)} onClose={()=>setScreen(null)} toast={toast} />}

    {toastMsg && <div className="toast">{toastMsg}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  function showErr(m){ var r=document.getElementById('root'); if(r){ r.innerHTML='<div style="padding:26px;font:15px -apple-system,sans-serif;color:#b00;line-height:1.6">Er ging iets mis:<br><b>'+m+'</b><br><br>Herlaad de pagina (Ctrl+F5).</div>'; } }
  try{
    if(typeof Babel==='undefined') throw new Error('Babel niet geladen — controleer je internet');
    if(typeof React==='undefined') throw new Error('React niet geladen — controleer je internet');
    if(typeof supabase==='undefined') throw new Error('Supabase niet geladen — controleer je internet');
    var src=document.getElementById('app-src').textContent;
    var out=Babel.transform(src,{presets:[['react',{runtime:'classic'}]]}).code;
    eval(out);
  }catch(e){ showErr(e.message||String(e)); console.error(e); }
})();
</script>
